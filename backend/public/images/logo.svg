<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <!-- Lighting Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#E51D24" />
      <stop offset="100%" stop-color="#B70F16" />
    </linearGradient>
    
    <!-- Subtle Brush Accent Gradient -->
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1d5db" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#9ca3af" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#9ca3af" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#d1d5db" stop-opacity="0.1" />
    </linearGradient>
    
    <!-- Drop Shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Brush Effect -->
  <g opacity="0.85">
    <path d="M 60,110 Q 150,98 260,105 Q 380,112 440,100 Q 420,118 310,116 Q 180,114 60,110 Z" fill="url(#brushGrad)" />
    <path d="M 80,165 Q 190,158 290,162 Q 390,166 430,158 Q 380,174 270,172 Q 150,170 80,165 Z" fill="url(#brushGrad)" />
  </g>

  <!-- Monogram S and R -->
  <g filter="url(#subtleShadow)">
    <!-- Letter S -->
    <text x="180" y="150" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="115" fill="#18181b" text-anchor="middle" letter-spacing="-2">S</text>
    
    <!-- Letter R -->
    <text x="315" y="150" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="115" fill="#18181b" text-anchor="middle" letter-spacing="-2">R</text>

    <!-- Electric Lightning Bolt slicing through SR -->
    <polygon points="275,35 210,132 250,132 225,188 292,108 252,108 275,35" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
  </g>

  <!-- Brand Name Text: SHREE RUDRA -->
  <text x="250" y="240" font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="44" fill="#E51D24" text-anchor="middle" letter-spacing="2">
    SHREE RUDRA
  </text>

  <!-- Subtitle Text: POWER SYSTEMS -->
  <text x="250" y="295" font-family="'Arial Black', 'Segoe UI Black', sans-serif" font-weight="900" font-size="28" fill="#111827" text-anchor="middle" letter-spacing="4">
    POWER SYSTEMS
  </text>
</svg>

