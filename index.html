<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=http://localhost:3000">
  <title>Shree Rudra Power Systems - Rooftop Solar Solutions</title>
  <link rel="icon" href="/images/logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .brand-logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    h1 span {
      color: #E51D24;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #E51D24;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 4px 14px rgba(229, 29, 36, 0.4);
      transition: all 0.2s;
    }
    .btn:hover {
      background: #b91c1c;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/images/logo.png" alt="Shree Rudra Power Systems" class="brand-logo">
    <h1>SHREE RUDRA <span>POWER SYSTEMS</span></h1>
    <p>Opening Shree Rudra Power Systems Portal...</p>
    <a href="http://localhost:3000" class="btn">Enter Official Website &rarr;</a>
  </div>
</body>
</html>
